name: Inspect TWSE financial fields

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/inspect-financial-fields.mjs'
      - '.github/workflows/inspect-financial-fields.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect official TWSE fields
        run: node scripts/inspect-financial-fields.mjs
