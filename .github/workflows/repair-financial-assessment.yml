name: Repair financial assessment wiring

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/repair-financial-assessment.py'
      - '.github/workflows/repair-financial-assessment.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Patch App financial assessment flow
        run: python scripts/repair-financial-assessment.py
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript check
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Production build
        run: npm run build
      - name: Commit repaired App
        shell: bash
        run: |
          if git diff --quiet -- src/App.tsx; then
            echo 'No App changes detected'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git commit -m 'Repair evidence-based financial assessment'
          git push origin HEAD:main
