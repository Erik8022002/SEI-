name: Repair visit strategy wiring

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repair-visit-strategy.yml'
      - 'scripts/repair-visit-strategy.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Patch App strategy flow
        run: python scripts/repair-visit-strategy.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript check
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Commit repaired App
        shell: bash
        run: |
          if git diff --quiet -- src/App.tsx; then
            echo 'No App changes detected'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git commit -m 'Repair AI visit strategy card generation'
          git push origin HEAD:main
