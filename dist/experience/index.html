<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071711" />
    <meta
      name="description"
      content="穿梭企業資料、情報整合、AI 財務分析與行動策略，探索商析 Compass 的企業金融情報世界。"
    />
    <title>商析 Compass｜企業情報之旅</title>
    <style>
      :root {
        color-scheme: dark;
        background: #071711;
        --font-apple-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
        --font-apple-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      }

      * { box-sizing: border-box; }
      html { background: #071711; }
      body { margin: 0; min-width: 320px; background: #071711; overscroll-behavior-y: none; }

      .skip-experience {
        position: fixed;
        z-index: 1000;
        top: 12px;
        left: 50%;
        padding: 10px 16px;
        color: #fff;
        background: #164b3d;
        border: 1px solid rgba(255,255,255,.22);
        border-radius: 999px;
        font-family: var(--font-apple-text);
        font-size: 13px;
        font-weight: 600;
        line-height: 1;
        text-decoration: none;
        transform: translate(-50%, -160%);
        transition: transform .2s ease;
      }
      .skip-experience:focus { transform: translate(-50%, 0); outline: 3px solid #e0a65f; outline-offset: 3px; }

      #world {
        --sw-bg: #071711;
        --sw-ink: #f5f1e8;
        --sw-ink-soft: #a8b8b2;
        --sw-accent: #d99b52;
        --sw-font-display: var(--font-apple-display);
        --sw-font-body: var(--font-apple-text);
        min-height: 100vh;
      }

      #world .sw-sky {
        background:
          radial-gradient(circle at 76% 42%, rgba(63,139,112,.24), transparent 34%),
          radial-gradient(circle at 12% 85%, rgba(217,155,82,.12), transparent 24%),
          #071711;
      }
      #world .sw-scene__still { object-position: center center; filter: saturate(.94) contrast(1.04); }
      #world .sw-stage::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 200;
        pointer-events: none;
        box-shadow: inset 0 0 180px rgba(2,12,9,.5);
      }
      #world .sw-brand__mark {
        border-radius: 4px 10px 4px 4px;
        background: linear-gradient(145deg, #e0a65f, #a86c31);
      }
      #world .sw-topcta { color: #10251e; background: #f5f1e8; }
      #world .sw-copy__title { letter-spacing: -.025em; line-height: 1.16; }
      #world .sw-copy__eyebrow { font-family: var(--font-apple-text); }
      #world .sw-copy__tags li { color: #f4d6ad; background: rgba(217,155,82,.1); border-color: rgba(217,155,82,.3); }
      #world .sw-btn--primary { color: #10251e; background: #e0a65f; box-shadow: 0 12px 35px rgba(224,166,95,.22); }
      #world .sw-btn--ghost { color: #f5f1e8; border-color: rgba(245,241,232,.3); }
      #world .sw-nav { background: rgba(7,23,17,.56); border-color: rgba(255,255,255,.12); }
      #world .sw-route__label { color: #f5f1e8; background: rgba(7,23,17,.8); border-color: rgba(255,255,255,.12); }

      .no-script {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 30px;
        color: #f5f1e8;
        font-family: var(--font-apple-text);
        text-align: center;
      }
      .no-script a { color: #e0a65f; }

      @media (max-width: 860px) {
        #world .sw-copylayer::before {
          width: 100%;
          background: linear-gradient(90deg, rgba(7,23,17,.94) 0%, rgba(7,23,17,.7) 54%, rgba(7,23,17,.12) 100%);
        }
        #world .sw-scene__still { object-position: 62% center; }
        #world .sw-stage::after { box-shadow: inset 0 0 90px rgba(2,12,9,.5); }
      }
    </style>
  </head>
  <body>
    <a class="skip-experience" href="/?app=1">略過動畫，直接進入平台</a>
    <div id="world"></div>
    <noscript>
      <div class="no-script">
        <p>此企業情報之旅需要 JavaScript 才能播放。<br /><a href="/?app=1">直接進入商析 Compass</a></p>
      </div>
    </noscript>
    <script src="/scroll-world/scrub-engine.js"></script>
    <script>
      window.mountScrollWorld(document.getElementById('world'), {
        brand: { name: '商析 Compass', href: '/?app=1' },
        cta: { label: '略過體驗', href: '/?app=1' },
        hint: '向下滑動，探索企業情報',
        nav: true,
        atmosphere: true,
        diveScroll: 1.45,
        connScroll: 0.8,
        crossfade: 0.2,
        sections: [
          {
            id: 'data-world',
            label: '企業資料',
            still: '/scroll-world/assets/scene-1-search.png',
            accent: '#d99b52',
            scroll: 1.55,
            linger: 0.18,
            eyebrow: 'Corporate Intelligence',
            title: '企業情報，散落在各個角落',
            body: '財務報告、重大訊息與法說資料，形成龐大而複雜的資訊世界。',
            tags: ['財務資訊', '重大訊息', '法說會'],
          },
          {
            id: 'integration',
            label: '情報整合',
            still: '/scroll-world/assets/scene-2-integration.png',
            accent: '#4da7a0',
            linger: 0.22,
            eyebrow: 'Data Integration',
            title: '整合公開資訊，建立完整企業輪廓',
            body: '將分散資訊清理、分類與串聯，轉換成可以搜尋、比較與追蹤的企業情報。',
            tags: ['資料清理', '企業辨識', '事件整理'],
          },
          {
            id: 'analysis',
            label: 'AI 分析',
            still: '/scroll-world/assets/scene-3-ai-analysis.png',
            accent: '#7b96d6',
            linger: 0.26,
            eyebrow: 'AI Financial Analysis',
            title: '讓 AI 看懂數字背後的變化',
            body: '從營收、獲利、現金流與財務結構中，找出趨勢、異常與風險訊號。',
            tags: ['財務評分', '風險雷達', '趨勢分析'],
          },
          {
            id: 'strategy',
            label: '行動策略',
            still: '/scroll-world/assets/scene-4-strategy.png',
            accent: '#8fb274',
            linger: 0.22,
            eyebrow: 'Business Strategy',
            title: '把企業情報，轉換成行動策略',
            body: '快速整理潛在切入機會、風險觀察、拜訪重點與建議提問。',
            tags: ['切入機會', '風險觀察', '建議提問'],
          },
          {
            id: 'compass',
            label: '商析 Compass',
            still: '/scroll-world/assets/scene-5-compass.png',
            accent: '#d99b52',
            scroll: 1.7,
            linger: 0.3,
            eyebrow: 'Compass',
            title: '從理解企業，到掌握下一步',
            body: '以完整企業情報協助業務做出更精準的判斷，讓每一次拜訪都有準備、有策略。',
            tags: [],
            cta: {
              primary: { label: '進入商析 Compass', href: '/?app=1' },
            },
          },
        ],
        connectors: [],
      })
    </script>
  </body>
</html>
